# Nasazení na Firebase Hosting (projekt oroom-advent, tarif Spark).
#   push do main      → TESTOVACÍ web (preview kanál „test“, adresa oroom-advent--test-….web.app, platí 30 dní)
#   push do produkce  → OSTRÝ web (oroom-advent.web.app, ostrá doména kalendáře)
# Kalendář je čistě statický web (bez databáze a přihlašování).
# Potřebuje v GitHubu (Settings → Secrets and variables → Actions):
#   - secret FIREBASE_SERVICE_ACCOUNT = JSON klíč servisního účtu (viz README, sekce Nasazení)
#   - (volitelně) proměnné: FIREBASE_PROJECT_ID (výchozí oroom-advent), SITE_URL (ostrá adresa kalendáře), GA_ID (měření GA4)
name: Nasazení na Firebase

on:
  push:
    branches: [main, produkce]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
      PROJECT: ${{ vars.FIREBASE_PROJECT_ID || 'oroom-advent' }}
    steps:
      - if: env.HAS_KEY != 'true'
        run: echo "::warning::Chybí secret FIREBASE_SERVICE_ACCOUNT – nasazení se přeskakuje (viz README)."
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SITE_URL: ${{ vars.SITE_URL }}
          VITE_GA_ID: ${{ vars.GA_ID }}
      - if: env.HAS_KEY == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Testovací web (preview kanál „test“)
        if: env.HAS_KEY == 'true' && github.ref_name == 'main'
        run: npx --yes firebase-tools@15 hosting:channel:deploy test --expires 30d --project "$PROJECT" --non-interactive
      - name: Ostrý web (live)
        if: env.HAS_KEY == 'true' && github.ref_name == 'produkce'
        run: npx --yes firebase-tools@15 deploy --only hosting --project "$PROJECT" --non-interactive
